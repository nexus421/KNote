name: Release

# Runs when a release is published on GitHub. The tag must match the version in build.gradle.kts (tag v1.2.0 needs
# version = "1.2.0"), otherwise the run fails and attaches nothing. Then it tests, builds knote.jar and attaches it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test buildFatJar

      - name: Attach knote.jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/libs/knote.jar --clobber --repo "$GITHUB_REPOSITORY"
